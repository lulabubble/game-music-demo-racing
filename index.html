<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Music Demo — Racing (Test)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #1a1a2e; color: #e0e0e0;
      font-family: system-ui, sans-serif;
    }
    canvas { background: #16213e; border-radius: 12px; display: block; }
    button {
      margin-top: 20px; padding: 12px 32px;
      font-size: 1.1rem; font-weight: 600;
      color: #1a1a2e; background: #e94560;
      border: none; border-radius: 8px; cursor: pointer;
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <h1 style="margin:0 0 10px; font-size:1.4rem;">Game Music Demo — Racing</h1>
  <p style="margin:0 0 20px; opacity:0.7;">Click the button — a square should jump</p>

  <canvas id="c" width="320" height="240"></canvas>
  <button id="btn">Jump!</button>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const btn = document.getElementById('btn');

    let x = canvas.width / 2 - 15;
    let y = canvas.height - 60;
    let vy = 0;
    let onGround = true;
    const GRAVITY = 0.6;
    const JUMP_FORCE = -12;

    function jump() {
      if (onGround) {
        vy = JUMP_FORCE;
        onGround = false;
      }
    }

    btn.addEventListener('click', jump);

    function update() {
      vy += GRAVITY;
      y += vy;
      const floor = canvas.height - 60;
      if (y >= floor) { y = floor; vy = 0; onGround = true; }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#0f3460';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 45);
      ctx.lineTo(canvas.width, canvas.height - 45);
      ctx.stroke();
      ctx.fillStyle = '#e94560';
      ctx.fillRect(x, y, 30, 30);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
